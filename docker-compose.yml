version: '3.8'

services:
  db:
    image: postgres:16
    container_name: qa_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: qa_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: qa_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres123@db:5432/qa_platform
      SECRET_KEY: mysecretkey123456789
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      GROQ_API_KEY: ${GROQ_API_KEY}
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: qa_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: